services:
  proma:
    build: .
    container_name: proma
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # Fotos bis ~10 MB erlauben (MAX_IMAGE_BYTES ist 8 MB)
      - BODY_SIZE_LIMIT=12M
      # Hinter Cloudflare-Tunnel: korrekte Origin/Client-IP ableiten
      # (CSRF-Check + Rate-Limit brauchen das; Cloudflare setzt x-forwarded-proto & x-forwarded-for)
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - ADDRESS_HEADER=x-forwarded-for
      - XFF_DEPTH=1
    ports:
      - "3210:3000"
    volumes:
      # Daten außerhalb des Containers – überleben Rebuilds/Neustarts
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - default
      - matrix-net # Cloudflare-Tunnel (cloudflared) erreicht uns unter http://proma:3000

networks:
  matrix-net:
    external: true
